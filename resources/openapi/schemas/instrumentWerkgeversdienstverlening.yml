    maxLength: 5000
    pattern: "^[a-zA-Z0-9]*$"
  OmsAanvraag:
    type: string
    maxLength: 5000
    pattern: "^[a-zA-Z0-9]*$"
  OmsInstrument:
    type: string
    maxLength: 5000
    pattern: "^[a-zA-Z0-9]*$"
  OmsVoorwaarden:
    type: string
    maxLength: 5000
    pattern: "^[a-zA-Z0-9]*$"
  IndDoelgroepregister:
    type: boolean
  IndTijdelijkeRegeling:
    type: boolean
  IndLeerwerktraject:
    type: boolean

  Instrument:
    $ref: './instrument.yml'
  Dienstverband:
    $ref: './dienstverband.yml'
  Leeftijdsgroep:
    $ref: './leeftijdsgroep.yml'
  SectorInstrument:
    $ref: './sectorInstrument.yml'
